<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minematt Server | Bedrock 26.3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="logo">M</div>
        <h1>Minematt Server</h1>
        <p class="description">Заходи и выживай вместе с нами!</p>
        
        <div class="info-grid">
            <div class="info-item">
                <span>IP:</span>
                <strong id="server-ip">minematt.falixsrv.me</strong>
            </div>
            <div class="info-item">
                <span>Порт:</span>
                <strong id="server-port">24240</strong>
            </div>
            <div class="info-item">
                <span>Версия:</span>
                <strong>26.3 (Bedrock)</strong>
            </div>
        </div>

        <div class="buttons">
            <a href="https://client.falixnodes.net/join?server=minematt" class="btn join-btn" target="_blank">Зайти быстро</a>
            <a href="https://t.me/minematt" class="btn tg-btn" target="_blank">Наш Telegram</a>
            <button class="btn copy-btn" onclick="copyIP()">Копировать IP</button>
        </div>
        
        <div id="status-msg"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
